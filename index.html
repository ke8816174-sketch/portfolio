<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Елизавета Кузнецова — Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap');

:root {
    --bg: #F5EFC6;
    --dark: #4A2E27;
    --yellow: #4D0E12;
    --blue: #A5BCD6;
    --coral: #4D0E12;
    --green: #A5BCD6;
    --gray: #D9D4C6;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
    background: var(--bg);
    color: var(--dark);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
    cursor: pointer;
}

/* ОБЩИЕ ЭЛЕМЕНТЫ */

.container {
    width: min(1200px, 90%);
    margin: auto;
}

.section { padding: 110px 0; }

.section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 22px;
    color: #76645B;
}

.section-title {
    font-size: clamp(38px, 6vw, 76px);
    font-weight: 800;
    letter-spacing: -4px;
    line-height: .98;
}

.accent { color: var(--blue); }

.small-text {
    font-size: 14px;
    line-height: 1.7;
    color: #65534B;
}

/* НАВИГАЦИЯ */

header {
    padding: 22px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #D8CFAF;
}

.logo {
    font-size: 19px;
    font-weight: 800;
}

.nav {
    display: flex;
    gap: 30px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
}

.nav a:hover { color: var(--blue); }

.nav-contact {
    border: 1px solid var(--dark);
    border-radius: 30px;
    padding: 10px 18px;
}

/* HERO */

.hero {
    min-height: 680px;
    padding: 80px 5% 90px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
}

.hero-content {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    position: relative;
    z-index: 2;
}

.hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.hero-top span {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(65px, 12vw, 150px);
    line-height: .83;
    letter-spacing: -10px;
    font-weight: 800;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
}

.hero h1 span {
    color: var(--blue);
    display: block;
    margin-left: 12%;
}

.hero-bottom {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-top: 65px;
    gap: 30px;
}

.hero-description {
    max-width: 300px;
    font-size: 15px;
    line-height: 1.7;
}

.hero-quote {
    max-width: 280px;
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    font-style: italic;
    text-align: right;
}

/* ФОТО */

.photo-placeholder {
    background: var(--gray);
    border: 1px solid #C9BEA1;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #84766C;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    overflow: hidden;
    position: relative;
}

.hero-photo {
    position: absolute;
    width: 190px;
    height: 245px;
    right: 13%;
    top: 100px;
    transform: rotate(5deg);
    border: 7px solid white;
    box-shadow: 0 10px 30px #00000015;
    z-index: 1;
}

.photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ПЛАВАЮЩИЕ ЭЛЕМЕНТЫ */

.bubble {
    position: absolute;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 12px;
    text-align: center;
    animation: float 4s ease-in-out infinite;
    z-index: 3;
}

.bubble-yellow {
    background: var(--yellow);
    width: 90px;
    height: 90px;
    top: 30px;
    left: 43%;
}

.bubble-blue {
    background: var(--blue);
    color: white;
    width: 105px;
    height: 105px;
    bottom: 115px;
    right: 5%;
    animation-delay: .7s;
}

.bubble-coral {
    background: var(--coral);
    width: 75px;
    height: 75px;
    top: 40%;
    left: 3%;
    animation-delay: 1.2s;
}

.bubble-green {
    background: var(--green);
    width: 83px;
    height: 83px;
    bottom: 30px;
    left: 47%;
    animation-delay: .4s;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(-5deg); }
    25% { transform: translate(8px, -12px) rotate(5deg); }
    50% { transform: translate(-5px, 8px) rotate(-8deg); }
    75% { transform: translate(10px, 5px) rotate(4deg); }
}

/* ABOUT */

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 70px;
    align-items: center;
}

.about-text {
    font-size: 19px;
    line-height: 1.8;
    max-width: 550px;
}

.about-text strong { color: var(--blue); }

.about-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 30px;
}

.tag {
    border: 1px solid var(--dark);
    padding: 9px 16px;
    border-radius: 30px;
    font-size: 12px;
}

.about-photo {
    height: 430px;
    transform: rotate(2deg);
}

/* ВИЗУАЛЬНАЯ ПЕРЕБИВКА */

.visual-break {
    background: var(--yellow);
    padding: 75px 5%;
    position: relative;
    overflow: hidden;
    text-align: center;
}

.visual-break p {
    font-size: clamp(35px, 7vw, 85px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -4px;
    text-transform: uppercase;
}

.visual-break span {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--blue);
}

.break-note {
    margin-top: 30px;
    font-size: 12px;
}

/* ОБРАЗОВАНИЕ И ПРОЕКТЫ */

.background-section { background: #E9E1BD; }

.background-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 55px;
}

.info-card {
    border: 1px solid #C9BEA1;
    padding: 28px;
    background: var(--bg);
    position: relative;
}

.info-card:nth-child(2) { background: var(--green); }
.info-card:nth-child(3) { background: var(--yellow); }
.info-card:nth-child(4) { background: var(--coral); }

.info-card h3 {
    font-size: 21px;
    margin-bottom: 12px;
}

.info-card .year {
    font-size: 12px;
    opacity: .65;
    margin-bottom: 18px;
}

.info-card .card-more {
    display: none;
    margin-top: 18px;
    line-height: 1.7;
    font-size: 14px;
}

.info-card.active .card-more { display: block; }

.info-card button {
    margin-top: 20px;
    border: 1px solid var(--dark);
    background: transparent;
    padding: 10px 17px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
}

.info-card button:hover {
    background: var(--dark);
    color: white;
}

/* ОПЫТ */

.experience-list {
    margin-top: 55px;
    border-top: 1px solid #C9BEA1;
}

.experience-item {
    display: grid;
    grid-template-columns: 150px 1fr 1fr;
    gap: 30px;
    padding: 32px 0;
    border-bottom: 1px solid #C9BEA1;
    align-items: start;
}

.experience-date {
    font-size: 12px;
    color: #76645B;
}

.experience-item h3 {
    font-size: 22px;
    margin-bottom: 8px;
}

.experience-item p {
    font-size: 13px;
    line-height: 1.7;
    color: #65534B;
}

.experience-number {
    font-size: 45px;
    font-weight: 800;
    color: var(--blue);
    opacity: .65;
}

/* БЕГУЩАЯ СТРОКА */

.marquee {
    background: var(--blue);
    color: white;
    overflow: hidden;
    padding: 23px 0;
    white-space: nowrap;
}

.marquee-track {
    display: flex;
    width: max-content;
    animation: marquee 20s linear infinite;
}

.marquee span {
    font-size: clamp(50px, 8vw, 100px);
    font-weight: 800;
    padding-right: 40px;
    letter-spacing: -4px;
}

@keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

/* КЕЙСЫ */

.cases-intro {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 45px;
}

.cases-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 45px 25px;
}

.case-card { cursor: pointer; }

.case-image {
    height: 320px;
    margin-bottom: 20px;
    position: relative;
    transition: .3s;
}

.case-card:nth-child(1) .case-image,
.case-card:nth-child(2) .case-image,
.case-card:nth-child(3) .case-image {
    background: #D9D4C6;
}

.case-card:hover .case-image {
    transform: translateY(-7px) rotate(-1deg);
}

.case-index {
    position: absolute;
    top: 18px;
    left: 18px;
    background: var(--yellow);
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
}

.case-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.case-info h3 { font-size: 21px; }

.case-info p {
    font-size: 12px;
    color: #76645B;
    margin-top: 7px;
}

.case-open {
    width: 45px;
    height: 45px;
    background: var(--yellow);
    border: none;
    border-radius: 50%;
    font-size: 23px;
    transition: .3s;
}

.case-card:hover .case-open {
    transform: rotate(45deg);
    background: var(--coral);
}

/* ОКНО КЕЙСА */

.modal {
    position: fixed;
    inset: 0;
    background: #4A2E27AA;
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal.active { display: flex; }

.modal-content {
    background: var(--bg);
    width: min(750px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 40px;
    position: relative;
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    border: none;
    background: none;
    font-size: 30px;
}

.modal-content h2 {
    font-size: 34px;
    margin-bottom: 20px;
}

.modal-content h3 {
    margin: 25px 0 8px;
    font-size: 15px;
    color: var(--blue);
    text-transform: uppercase;
}

.modal-content p {
    font-size: 14px;
    line-height: 1.7;
}

.modal-stats {
    margin-top: 25px;
    padding: 20px;
    background: var(--blue);
    font-weight: 800;
    line-height: 1.6;
}

/* НАВЫКИ */

.skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    margin-top: 55px;
}

.skills-column h3 {
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.skill {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 17px 0;
    border-bottom: 1px solid #C9BEA1;
    font-size: 14px;
}

.skill span:last-child {
    color: #76645B;
    font-size: 12px;
}

.hobbies {
    margin-top: 60px;
    padding: 30px;
    background: var(--blue);
    line-height: 1.8;
    font-size: 14px;
}

/* КОНТАКТЫ */

.contacts {
    background: var(--yellow);
    color: var(--bg);
    padding: 100px 5%;
}

.contacts .section-label { color: var(--blue); }

.contacts h2 {
    font-size: clamp(55px, 10vw, 125px);
    line-height: .9;
    letter-spacing: -7px;
    margin-bottom: 65px;
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    max-width: 850px;
}

.contact-item {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 20px;
    border-bottom: 1px solid #FFFFFF55;
}

.contact-item span {
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 2px;
}

.contact-item a {
    font-size: 17px;
    font-weight: 600;
}

.contact-item a:hover { color: var(--blue); }

/* FOOTER */

footer {
    padding: 25px 5%;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 10px;
    letter-spacing: 1px;
}

/* АДАПТИВНОСТЬ */

@media (max-width: 768px) {
    header { flex-wrap: wrap; gap: 20px; }

    .nav {
        width: 100%;
        gap: 15px;
        flex-wrap: wrap;
        font-size: 10px;
    }

    .hero { min-height: 650px; }

    .hero h1 {
        font-size: clamp(55px, 15vw, 100px);
        letter-spacing: -5px;
    }

    .hero-photo {
        width: 130px;
        height: 170px;
        right: 7%;
        top: 50px;
    }

    .hero-bottom {
        flex-direction: column;
        align-items: flex-start;
        margin-top: 45px;
    }

    .hero-quote { text-align: left; }

    .bubble-yellow {
        left: 65%;
        top: 10px;
    }

    .bubble-coral { left: 1%; }

    .about-grid,
    .background-grid,
    .cases-grid,
    .skills-grid {
        grid-template-columns: 1fr;
    }

    .about-grid { gap: 35px; }

    .about-photo { height: 320px; }

    .experience-item {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .experience-number { font-size: 32px; }

    .cases-intro {
        flex-direction: column;
        align-items: flex-start;
    }

    .case-image { height: 250px; }

    .modal-content { padding: 30px 22px; }

    .contact-grid { grid-template-columns: 1fr; }

    footer {
        flex-direction: column;
        text-align: center;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
